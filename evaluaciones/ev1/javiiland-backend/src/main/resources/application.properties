spring.application.name=javiiland

# ---- Perfil local: evita conexión a un Identity Provider durante el desarrollo ----
# ---- Base de datos MySQL ----
spring.datasource.url=jdbc:mysql://localhost:3306/reservas_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:system}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ---- Servidor ----
server.port=8080
# API Gateway actúa como proxy inverso y puede enviar X-Forwarded-*.
# Esta opción permite que Spring use el esquema, host y puerto originales.
server.forward-headers-strategy=framework

# ---- JWT local (perfil local) ----
# Secreto HMAC compartido entre el firmador (JwtService) y el decoder (SecurityConfig).
javiiland.security.jwt-secret=${JWT_SECRET:javiiland-local-secret-key-2026-32bytes}
javiiland.security.jwt-expiration-minutes=480

# ---- Usuario ADMIN por defecto ----
javiiland.admin.username=${JAVIILAND_ADMIN_USERNAME:admin}
javiiland.admin.password=${JAVIILAND_ADMIN_PASSWORD:admin123}
javiiland.admin.email=${JAVIILAND_ADMIN_EMAIL:admin@javiiland.local}

# ---- OAuth2 Resource Server ----
# LOCAL: estas propiedades permanecen comentadas para evitar conexión a internet o a un IdP real.
# El JwtDecoder HMAC de SecurityConfig se utiliza únicamente con el perfil local.
# PRODUCCIÓN: descomentar ambas líneas y reemplazar las variables por los valores de Azure AD o Cognito.

spring.security.oauth2.resourceserver.jwt.issuer-uri=${AZURE_ISSUER_URI:https://login.microsoftonline.com/015d23c7-651d-40e7-91fb-cf10d50e79cf/v2.0}
spring.security.oauth2.resourceserver.jwt.audiences=${AZURE_AUDIENCE:api://9515c169-89f0-4bba-8083-d95fe2211260}

# audiences: identificador de audiencia de la API registrada en Azure AD o Cognito

# Si el balanceador/proxy del entorno expone X-Forwarded-* mediante el contenedor
# Servlet en vez de Spring, puede utilizarse native como alternativa:
# server.forward-headers-strategy=native